<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpankh Cafe & Restro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --bg: #121212; }
        body { background-color: var(--bg); color: #fff; font-family: 'Poppins', sans-serif; padding-bottom: 100px; }
        .header { text-align: center; padding: 30px; border-bottom: 2px solid var(--gold); }
        .header h1 { font-family: 'Cinzel', serif; color: var(--gold); }
        
        .main-category { 
            background: linear-gradient(90deg, #2a2a2a, #1a1a1a); 
            border-left: 4px solid var(--gold);
            padding: 15px; margin: 15px; border-radius: 0 10px 10px 0;
            font-weight: bold; cursor: pointer; display: flex; justify-content: space-between;
        }
        .category-content { display: none; padding: 0 15px; }
        .food-card { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #333; }
        
        /* Floating Cart Bar */
        .cart-bar { 
            position: fixed; bottom: 0; width: 100%; background: #1a1a1a; 
            padding: 15px; border-top: 2px solid var(--gold); display: flex; 
            justify-content: space-between; align-items: center; z-index: 100;
        }
        .btn { background: var(--gold); border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; color: #000; }
        .input-box { width: 90%; padding: 10px; margin: 10px auto; display: block; border-radius: 5px; border: 1px solid var(--gold); background: #222; color: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🦚 Morpankh Cafe & Restro</h1>
        <input type="text" id="name" class="input-box" placeholder="अपना नाम लिखें...">
    </div>

    <!-- Menu Container -->
    <div id="menu"></div>

    <!-- Cart -->
    <div class="cart-bar">
        <div>Bill: ₹<span id="total">0</span></div>
        <button class="btn" onclick="sendOrder()">Place Order ➔</button>
    </div>

    <script>
        const menuData = {
            "PIZZA": {"Veg Pizza": 170, "Onion Pizza": 150, "Paneer Cheese": 230},
            "BURGER": {"Veg Burger": 50, "Cheese Burger": 80, "Double Tikki": 150}
            // Aise hi baki items...
        };

        let cart = {}; let total = 0;

        function add(item, price) {
            cart[item] = (cart[item] || 0) + 1;
            total += price;
            document.getElementById('total').innerText = total;
            alert(item + " add ho gaya!");
        }

        function sendOrder() {
            let name = document.getElementById('name').value;
            let msg = `Order from ${name}: %0A`;
            for(let i in cart) msg += `${i} x ${cart[i]} %0A`;
            msg += `Total: ₹${total}`;
            window.open("https://wa.me/917014808515?text=" + msg);
        }
    </script>
</body>
</html>

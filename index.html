<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpankh Cafe & Restro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #121212; color: #f4f4f4; padding-bottom: 140px; }
        header { background: linear-gradient(135deg, #1a1a1a, #0a0a0a); padding: 30px 20px; text-align: center; border-bottom: 3px solid #d4af37; }
        .logo { font-size: 45px; margin-bottom: 5px; }
        header h1 { font-family: 'Cinzel', serif; color: #d4af37; font-size: 24px; }
        .owner-info { font-size: 13px; color: #ccc; margin-top: 10px; }
        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; }
        
        .service-box { background: #1e1e1e; padding: 20px; border-radius: 16px; border: 1px solid #d4af37; margin-bottom: 20px; }
        .input-field { width: 100%; padding: 12px; background: #252525; border: 1px solid #444; border-radius: 8px; color: #fff; margin-top: 10px; }
        
        .main-category { background: #d4af37; color: #000; padding: 15px; margin: 10px 0; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; }
        .category-content { display: none; padding: 5px 0; }
        
        .food-card { background: #1a1a1a; padding: 12px; margin-bottom: 10px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #333; }
        .add-btn { background: #d4af37; color: #000; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .cart-bar { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: #000; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #d4af37; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🦚</div>
        <h1>Morpankh Cafe & Restro</h1>
        <div class="owner-info">
            Kishan Asopa | 7014808515, 9928427598<br>
            Napasar, 334201
        </div>
    </header>

    <div class="container">
        <div class="service-box">
            <input type="text" id="custName" class="input-field" placeholder="अपना नाम लिखें">
            <div style="margin-top:15px;">
                <label><input type="radio" name="type" onclick="show('dine')" checked> टेबल पर खाना (Dine-In)</label>
                <label style="margin-left:15px;"><input type="radio" name="type" onclick="show('del')"> होम डिलीवरी (Delivery)</label>
            </div>
            <input type="text" id="dine" class="input-field" placeholder="टेबल नंबर लिखें">
            <input type="text" id="del" class="input-field" placeholder="अपना पूरा पता लिखें" style="display:none">
        </div>

        <div class="main-category" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'block' ? 'none' : 'block'">🍕 पिज्जा मेन्यू</div>
        <div class="category-content">
            <div class="food-card"><div>Veg Pizza<br><b>₹170</b></div><button class="add-btn" onclick="add(this, 'Veg Pizza', 170)">जोड़ें</button></div>
            <div class="food-card"><div>Onion Pizza<br><b>₹150</b></div><button class="add-btn" onclick="add(this, 'Onion Pizza', 150)">जोड़ें</button></div>
        </div>
    </div>

    <div class="cart-bar">
        <div>कुल बिल: ₹<span id="total">0</span></div>
        <button class="add-btn" onclick="order()">ऑर्डर भेजें</button>
    </div>

    <script>
        let cart = {}, total = 0;
        function show(id) { 
            document.getElementById('dine').style.display = id=='dine'?'block':'none'; 
            document.getElementById('del').style.display = id=='del'?'block':'none'; 
        }
        function add(btn, n, p) { 
            cart[n] = (cart[n] || 0) + 1;
            total += p;
            document.getElementById('total').innerText = total;
            btn.innerText = "Added!";
            setTimeout(() => btn.innerText = "जोड़ें", 1000);
        }
        function order() { 
            let name = document.getElementById('custName').value;
            if(!name) { alert("कृपया अपना नाम लिखें!"); return; }
            let msg = `नया ऑर्डर: ${name}\nकुल बिल: ₹${total}`;
            window.open("https://wa.me/917014808515?text=" + encodeURIComponent(msg));
        }
    </script>
</body>
</html>

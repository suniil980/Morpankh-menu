<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpankh Cafe & Restro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #121212; color: #fff; padding-bottom: 100px; }
        .header { text-align: center; padding: 20px; border-bottom: 2px solid #d4af37; }
        .container { max-width: 500px; margin: 20px auto; padding: 15px; }
        .input-box { width: 100%; padding: 12px; margin-bottom: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 8px; }
        .item { background: #1e1e1e; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .btn { background: #d4af37; color: #000; padding: 8px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .footer-bar { position: fixed; bottom: 0; width: 100%; max-width: 500px; left: 50%; transform: translateX(-50%); background: #000; padding: 15px; border-top: 2px solid #d4af37; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Morpankh Cafe & Restro</h1>
        <p>Owner: Kishan Asopa | 7014808515</p>
    </div>

    <div class="container">
        <input type="text" id="custName" class="input-box" placeholder="अपना नाम लिखें">
        <input type="text" id="address" class="input-box" placeholder="पता या टेबल नंबर">
        
        <div class="item">Veg Pizza (₹170) <button class="btn" onclick="add('Veg Pizza', 170)">Add</button></div>
        <div class="item">Veg Burger (₹50) <button class="btn" onclick="add('Veg Burger', 50)">Add</button></div>
        <div class="item">Veg Chowmein (₹60) <button class="btn" onclick="add('Veg Chowmein', 60)">Add</button></div>
    </div>

    <div class="footer-bar">
        <p>Total Bill: ₹<span id="total">0</span></p>
        <button class="btn" style="width:100%; margin-top:10px;" onclick="sendOrder()">Place Order (WhatsApp)</button>
    </div>

    <script>
        let total = 0, items = [];
        function add(n, p) { total += p; items.push(n); document.getElementById('total').innerText = total; }
        function sendOrder() {
            let name = document.getElementById('custName').value;
            let addr = document.getElementById('address').value;
            if(!name || items.length == 0) { alert("Naam aur item select karein!"); return; }
            let msg = `Order: ${items.join(", ")}%0ATotal: ₹${total}%0AName: ${name}%0ADetails: ${addr}`;
            window.location.href = "https://wa.me/917014808515?text=" + msg;
        }
    </script>
</body>
</html>

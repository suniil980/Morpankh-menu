<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpankh Cafe & Restro</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 20px; margin-bottom: 120px; }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #d4af37; padding-bottom: 10px; }
        .service-box { background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #d4af37; margin-bottom: 20px; }
        .input-field { width: 100%; padding: 10px; margin: 5px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .main-category { background: #d4af37; color: #000; padding: 15px; margin: 10px 0; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; }
        .category-content { display: none; padding: 10px; background: #1e1e1e; border-radius: 8px; margin-bottom: 10px; }
        .food-card { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #333; }
        .btn-group { display: flex; gap: 5px; }
        .add-btn { background: #d4af37; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .sub-btn { background: #ff4444; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
        .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; padding: 15px; border-top: 2px solid #d4af37; box-sizing: border-box; }
        .insta-link { color: #d4af37; text-decoration: none; font-weight: bold; display: block; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h2>MORPANKH CAFE & RESTRO</h2>
    <p style="font-size: 14px;">Owner: Kishan Asopa | 7014808515<br>Karant Balaji Market, 1st Floor, Napasar, Bikaner</p>
    <a href="https://www.instagram.com/AAPKI_ID/" target="_blank" class="insta-link">📸 Instagram par follow karein</a>
</div>

<div class="service-box">
    <input type="text" id="custName" class="input-field" placeholder="अपना नाम लिखें">
    <input type="text" id="dine" class="input-field" placeholder="टेबल नंबर या पता लिखें">
</div>

<div id="menu-container"></div>

<div class="cart-bar">
    <div style="margin-bottom: 10px;"><b>आपका ऑर्डर:</b> <span id="cart-items">Khali</span></div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>Total: ₹<span id="total">0</span></div>
        <button class="add-btn" onclick="order()" style="padding: 10px 20px;">WhatsApp पर ऑर्डर भेजें</button>
    </div>
</div>

<script>
    const menu = {
        "🌯 Roll": {"Veg Roll": 100, "Frankie Roll": 120},
        "🍕 पिज्जा": {"Veg Pizza": 170, "Paneer Pizza": 230},
        "🍔 बर्गर": {"Veg Burger": 50, "Cheese Burger": 80}
        // ... baaki items yahan pehle jaise hi rahenge
    };

    let cart = {}, total = 0;

    function renderMenu() {
        const container = document.getElementById('menu-container');
        for (let cat in menu) {
            container.innerHTML += `<div class="main-category" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display==='block'?'none':'block'">${cat} <span>▼</span></div><div class="category-content" id="${cat.replace(/ /g, '_')}"></div>`;
            for (let item in menu[cat]) {
                document.getElementById(cat.replace(/ /g, '_')).innerHTML += `<div class="food-card">${item} <span>₹${menu[cat][item]}</span> <div class="btn-group"><button class="sub-btn" onclick="update('${item}', ${menu[cat][item]}, -1)">-</button><button class="add-btn" onclick="update('${item}', ${menu[cat][item]}, 1)">+</button></div></div>`;
            }
        }
    }

    function update(n, p, q) {
        if (!cart[n]) cart[n] = 0;
        cart[n] += q;
        if (cart[n] < 0) cart[n] = 0;
        total += (p * q);
        if (total < 0) total = 0;
        document.getElementById('total').innerText = total;
        updateCartDisplay();
    }

    function updateCartDisplay() {
        let display = "";
        for(let i in cart) if(cart[i] > 0) display += `${i}(${cart[i]}), `;
        document.getElementById('cart-items').innerText = display || "Khali";
    }

    function order() {
        let name = document.getElementById('custName').value;
        let details = document.getElementById('dine').value;
        if(!name) { alert("नाम लिखें!"); return; }
        let msg = `*ORDER - Morpankh*%0A👤 ${name}%0A📍 ${details}%0A-------------------%0A`;
        for(let i in cart) if(cart[i] > 0) msg += `${i} x ${cart[i]}%0A`;
        msg += `-------------------%0A💰 Total: ₹${total}`;
        window.open("https://wa.me/917014808515?text=" + msg);
    }

    renderMenu();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpankh Cafe & Restro v2</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #121212; color: #f4f4f4; padding-bottom: 140px; }
        header { background: linear-gradient(135deg, #1a1a1a, #0a0a0a); padding: 30px 20px; text-align: center; border-bottom: 3px solid #d4af37; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .logo { font-size: 45px; margin-bottom: 5px; filter: drop-shadow(0px 0px 8px #d4af37); }
        header h1 { font-family: 'Cinzel', serif; font-size: 26px; color: #d4af37; letter-spacing: 2px; margin-bottom: 8px; }
        .owner-info { font-size: 13px; color: #ccc; line-height: 1.6; font-weight: 400; }
        .owner-info strong { color: #d4af37; }
        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; }
        
        .service-box { background: linear-gradient(135deg, #1e1e1e, #151515); padding: 20px 15px; border-radius: 16px; text-align: center; margin-bottom: 25px; border: 1px solid rgba(212, 183, 55, 0.5); }
        .service-box h2 { font-family: 'Cinzel', serif; color: #d4af37; font-size: 16px; margin-bottom: 12px; }
        .service-options { display: flex; justify-content: center; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
        .service-lbl { background: #252525; padding: 10px 16px; border-radius: 10px; font-size: 13px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 8px; }
        .service-lbl:has(input:checked) { background: rgba(212, 183, 55, 0.15); border-color: #d4af37; color: #d4af37; }
        .input-field { width: 100%; max-width: 320px; padding: 11px 12px; background: #252525; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; text-align: center; margin: 8px auto 0 auto; display: block; font-size: 14px; }
        
        .main-category { background: linear-gradient(90deg, #aa841b, #d4af37); color: #121212; font-family: 'Cinzel', serif; font-size: 16px; font-weight: bold; padding: 14px; margin: 12px 0; border-radius: 10px; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .main-category::after { content: '➕'; font-size: 12px; }
        .main-category.active::after { content: '➖'; }
        .category-content { display: none; padding: 5px 0; }
        
        .food-card { background: #1e1e1e; border-radius: 16px; margin-bottom: 12px; display: flex; align-items: center; padding: 12px; border: 1px solid rgba(255,255,255,0.03); box-shadow: 0 4px 10px rgba(0,0,0,0.2); position: relative; }
        .food-img { width: 55px; height: 55px; font-size: 28px; display: flex; align-items: center; justify-content: center; background: #252525; border-radius: 10px; }
        .food-info { padding-left: 15px; flex: 1; }
        .food-title { font-size: 14px; font-weight: 600; color: #fff; padding-right: 80px; }
        .price { color: #d4af37; font-weight: 700; display: block; margin-top: 4px; font-size: 15px; }
        .add-btn { position: absolute; right: 12px; bottom: 12px; background: linear-gradient(135deg, #d4af37, #aa841b); color: #121212; border: none; padding: 6px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
        
        .cart-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: #1a1a1a; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #d4af37; border-radius: 20px 20px 0 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); z-index: 999; }
        .cart-text { font-size: 14px; color: #fff; }
        .order-btn { background: linear-gradient(135deg, #d4af37, #aa841b); color: #121212; padding: 10px 22px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div class="logo">🦚</div>
        <h1>Morpankh Cafe & Restro</h1>
        <div class="owner-info">
            👤 <strong>Owner:</strong> Kishan Asopa <br>
            📞 <strong>Call:</strong> 7014808515 <br>
            📍 <strong>Address:</strong> Karant Balaji Market, Napasar 334201
        </div>
    </header>
    <div class="container">
        <div class="service-box">
            <h2>🍽️ Order Details</h2>
            <input type="text" id="custName" class="input-field" placeholder="अपना नाम लिखें">
            <div class="service-options">
                <label class="service-lbl"><input type="radio" name="type" onclick="show('dine')" checked> Dine-In</label>
                <label class="service-lbl"><input type="radio" name="type" onclick="show('del')"> Delivery</label>
            </div>
            <input type="number" id="dine" class="input-field" placeholder="टेबल नंबर (e.g. 3)" style="display:block">
            <input type="text" id="del" class="input-field" placeholder="पूरा पता लिखें" style="display:none">
            
            <h2 style="margin-top: 20px; margin-bottom: 10px;">💵 Payment Mode</h2>
            <div class="service-options">
                <label class="service-lbl"><input type="radio" name="pay" value="Cash" checked> Cash</label>
                <label class="service-lbl"><input type="radio" name="pay" value="Online UPI"> Online UPI</label>
            </div>
        </div>

        <div class="main-category" onclick="toggleCategory(this)">🍕 PIZZA</div>
        <div class="category-content">
            <div class="food-card"><div class="food-img">🍕</div><div class="food-info"><div class="food-title">Veg Pizza</div><span class="price">₹170</span><button class="add-btn" onclick="add('Veg Pizza', 170)">Add</button></div></div>
            <div class="food-card"><div class="food-img">🧅</div><div class="food-info"><div class="food-title">Onion Pizza</div><span class="price">₹150</span><button class="add-btn" onclick="add('Onion Pizza', 150)">Add</button></div></div>
        </div>
        </div>

    <div class="cart-bar">
        <div class="cart-text">Total Items: <span id="count">0</span> | Bill: ₹<span id="total">0</span></div>
        <button class="order-btn" onclick="order()">Place Order ➔</button>
    </div>

    <script>
        let cart = {}, total = 0, itemCount = 0;
        function toggleCategory(element) {
            element.classList.toggle("active");
            let content = element.nextElementSibling;
            content.style.display = content.style.display === "block" ? "none" : "block";
        }
        function show(id) { 
            document.getElementById('dine').style.display = id=='dine'?'block':'none'; 
            document.getElementById('del').style.display = id=='del'?'block':'none'; 
        }
        function add(n, p) { 
            if(cart[n]) { cart[n].qty += 1; } else { cart[n] = { price: p, qty: 1 }; }
            total += p; itemCount += 1;
            document.getElementById('count').innerText = itemCount;
            document.getElementById('total').innerText = total; 
        }
        function order() { 
            let name = document.getElementById('custName').value.trim();
            if(!name) { alert("Kripya pehle apna Naam dalein!"); return; }
            if(itemCount === 0) { alert("Kripya item add karein!"); return; }
            let type = document.getElementById('dine').style.display === 'block' ? 'Dine-In' : 'Home Delivery';
            let detail = type === 'Dine-In' ? 'Table: ' + document.getElementById('dine').value : 'Address: ' + document.getElementById('del').value;
            let payMethod = document.querySelector('input[name="pay"]:checked').value;
            let itemsList = []; 
            for (let item in cart) { itemsList.push(`${item} x ${cart[item].qty}`); }
            let msg = `*NEW ORDER*\n👤 ${name}\n📌 ${type}\n🪑 ${detail}\n💳 ${payMethod}\n\n${itemsList.join("\n")}\n\n💰 TOTAL: ₹${total}`;
            window.open("https://wa.me/917014808515?text=" + encodeURIComponent(msg));
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpankh Cafe & Restro</title>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; margin-bottom: 150px; }
        .header { text-align: center; border-bottom: 2px solid #d4af37; padding-bottom: 10px; margin-bottom: 20px; }
        .main-category { background: #d4af37; color: #000; padding: 15px; margin: 10px 0; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; }
        .category-content { display: none; padding: 10px; background: #1e1e1e; border-radius: 8px; }
        .food-card { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #333; }
        .btn-group { display: flex; gap: 5px; }
        .btn { border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; padding: 15px; border-top: 2px solid #d4af37; box-sizing: border-box; text-align: center; }
    </style>
</head>
<body>

<div class="header">
    <h2>MORPANKH CAFE & RESTRO</h2>
</div>

<div id="menu-container"></div>

<div class="cart-bar">
    <div>Total Bill: ₹<span id="total">0</span></div>
    <button class="btn" style="background:#d4af37; width:90%; margin-top:10px; padding: 10px;" onclick="order()">WhatsApp पर ऑर्डर भेजें</button>
</div>

<script>
    const menu = {
        "🌯 Roll": {"Veg Roll": 100, "Frankie Roll": 120},
        "🥟 Momos": {"Steam Momos": 100, "Fried Momos": 120},
        "🍕 पिज्जा": {"Veg Pizza": 170, "Paneer Pizza": 230},
        "🍔 बर्गर": {"Veg Burger": 50, "Cheese Burger": 80},
        "🥪 सैंडविच": {"Veg Sandwich": 100, "Cheese Sandwich": 120},
        "🍟 फ्रेंच फ्राई": {"French Fries (Full)": 80, "French Fries (Half)": 60},
        "🍞 पावभाजी": {"Masala Pav Bhaji": 100, "Pav Bhaji": 80},
        "🍜 चाऊमीन": {"Veg Chowmein": 60, "Garlic Chowmein": 80},
        "🧆 मन्चुरियन": {"Dry Manchurian": 90, "Gravy Manchurian": 110},
        "🥞 डोसा": {"Masala Dosa": 100, "Plain Dosa": 80}
    };

    let cart = {};
    const container = document.getElementById('menu-container');

    for (let cat in menu) {
        let catId = cat.replace(/ /g, '_');
        container.innerHTML += `<div class="main-category" onclick="document.getElementById('${catId}').style.display = document.getElementById('${catId}').style.display==='block'?'none':'block'">${cat} <span>▼</span></div><div class="category-content" id="${catId}"></div>`;
        for (let item in menu[cat]) {
            document.getElementById(catId).innerHTML += `<div class="food-card">${item} <span>₹${menu[cat][item]}</span> <div class="btn-group"><button class="btn" style="background:#ff4444" onclick="update('${item}', -${menu[cat][item]})">-</button><button class="btn" style="background:#d4af37" onclick="update('${item}', ${menu[cat][item]})">+</button></div></div>`;
        }
    }

    function update(item, price) {
        if (!cart[item]) cart[item] = { qty: 0, price: Math.abs(price) };
        cart[item].qty += (price > 0 ? 1 : -1);
        if (cart[item].qty < 0) cart[item].qty = 0;
        let total = 0;
        for (let i in cart) total += (cart[i].qty * cart[i].price);
        document.getElementById('total').innerText = total;
    }

    function order() {
        let total = document.getElementById('total').innerText;
        let msg = "Morpankh Order Details:%0A";
        for (let i in cart) if(cart[i].qty > 0) msg += `${i} x ${cart[i].qty}%0A`;
        msg += `Total Bill: ₹${total}`;
        window.open("https://wa.me/917014808515?text=" + msg);
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpankh Cafe & Restro | Premium Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #121212; color: #f4f4f4; padding-bottom: 120px; }
        header { background: linear-gradient(135deg, #1a1a1a, #0a0a0a); padding: 35px 20px; text-align: center; border-bottom: 3px solid #d4af37; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .logo { font-size: 45px; margin-bottom: 5px; filter: drop-shadow(0px 0px 8px #d4af37); }
        header h1 { font-family: 'Cinzel', serif; font-size: 26px; color: #d4af37; letter-spacing: 2px; }
        header p { color: #ccc; font-size: 12px; margin-top: 5px; letter-spacing: 1px; }
        .container { max-width: 500px; margin: 20px auto; padding: 0 15px; }
        .service-box { background: linear-gradient(135deg, #1e1e1e, #151515); padding: 20px 15px; border-radius: 16px; text-align: center; margin-bottom: 25px; border: 1px solid rgba(212, 183, 55, 0.5); }
        .service-box h2 { font-family: 'Cinzel', serif; color: #d4af37; font-size: 16px; margin-bottom: 12px; }
        .service-options { display: flex; justify-content: center; gap: 15px; margin-bottom: 12px; }
        .service-lbl { background: #252525; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
        .service-lbl:has(input:checked) { background: rgba(212, 183, 55, 0.15); border-color: #d4af37; color: #d4af37; }
        .input-field { width: 100%; max-width: 280px; padding: 8px 12px; background: #252525; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 13px; text-align: center; margin-top: 5px; display: none; }
        .category-title { color: #d4af37; font-family: 'Cinzel', serif; font-size: 18px; margin: 35px 0 15px; border-left: 3px solid #d4af37; padding-left: 10px; }
        .food-card { background: #1e1e1e; border-radius: 16px; margin-bottom: 18px; display: flex; align-items: center; padding: 12px; border: 1px solid rgba(255,255,255,0.03); }
        .food-info { flex: 1; padding-left: 10px; position: relative; }
        .food-name { font-size: 14px; font-weight: 600; display: block; }
        .food-name-en { font-size: 12px; color: #aaa; display: block; }
        .price { font-weight: 600; color: #d4af37; font-size: 15px; display: block; margin-top: 2px; }
        .add-btn { position: absolute; right: 0; top: 50%; transform: translateY(-50%); background: linear-gradient(135deg, #d4af37, #aa841b); color: #121212; border: none; padding: 6px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">🦚</div>
        <h1>Morpankh Cafe & Restro</h1>
    </header>

    <div class="container">
        <!-- Order Type -->
        <div class="service-box">
            <h2>🍽️ Select Order Type</h2>
            <div class="service-options">
                <label class="service-lbl" onclick="toggleServiceInput('dinein')"><input type="radio" name="order_type" id="type_dinein" value="Dine-In" checked> Dine-In</label>
                <label class="service-lbl" onclick="toggleServiceInput('delivery')"><input type="radio" name="order_type" id="type_delivery" value="Delivery"> Delivery</label>
            </div>
            <input type="number" id="table_number" class="input-field" placeholder="Table No." style="display: inline-block;">
            <input type="text" id="delivery_address" class="input-field" placeholder="Full Address">
        </div>

        <!-- Items with Hindi & English -->
        <h2 class="category-title">🍕 Pizza</h2>
        <div class="food-card"><div class="food-info"><span class="food-name">वेज पिज्जा</span><span class="food-name-en">Veg Pizza</span><span class="price">₹170</span><button class="add-btn" onclick="addToCart('Veg Pizza', 170)">Add</button></div></div>
        <div class="food-card"><div class="food-info"><span class="food-name">ऑनियन पिज्जा</span><span class="food-name-en">Onion Pizza</span><span class="price">₹150</span><button class="add-btn" onclick="addToCart('Onion Pizza', 150)">Add</button></div></div>
        <div class="food-card"><div class="food-info"><span class="food-name">पनीर चीज पिज्जा</span><span class="food-name-en">Paneer Cheese Pizza</span><span class="price">₹230</span><button class="add-btn" onclick="addToCart('Paneer Cheese Pizza', 230)">Add</button></div></div>

        <h2 class="category-title">🍔 Burger</h2>
        <div class="food-card"><div class="food-info"><span class="food-name">वेज बर्गर</span><span class="food-name-en">Veg Burger</span><span class="price">₹50</span><button class="add-btn" onclick="addToCart('Veg Burger', 50)">Add</button></div></div>
        <div class="food-card"><div class="food-info"><span class="food-name">डबल टिक्की बर्गर</span><span class="food-name-en">Double Tikki Burger</span><span class="price">₹150</span><button class="add-btn" onclick="addToCart('Double Tikki Burger', 150)">Add</button></div></div>

        <!-- Yahan baaki items isi format me add kar lein -->
        <p style="text-align: center; color: #666; margin-top: 20px;">For more items, update code similarly.</p>
    </div>

    <script>
        function toggleServiceInput(type) {
            document.getElementById('table_number').style.display = (type === 'dinein') ? 'inline-block' : 'none';
            document.getElementById('delivery_address').style.display = (type === 'delivery') ? 'inline-block' : 'none';
        }
        function addToCart(name, price) { alert(name + " added!"); }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpankh Cafe & Restro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #121212; color: #fff; padding-bottom: 120px; }
        header { background: #1a1a1a; padding: 20px; text-align: center; border-bottom: 2px solid #d4af37; }
        .container { max-width: 500px; margin: 20px auto; padding: 15px; }
        .input-box { width: 100%; padding: 12px; margin-bottom: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 8px; }
        .cat-title { background: #d4af37; color: #000; padding: 10px; margin: 15px 0; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .item { background: #1e1e1e; padding: 12px; margin-top: 5px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .btn { background: #d4af37; color: #000; padding: 5px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .footer { position: fixed; bottom: 0; width: 100%; max-width: 500px; background: #000; padding: 15px; border-top: 2px solid #d4af37; text-align: center; }
    </style>
</head>
<body>
    <header><h1>Morpankh Cafe & Restro</h1></header>
    <div class="container">
        <input type="text" id="custName" class="input-box" placeholder="अपना नाम लिखें">
        <input type="text" id="address" class="input-box" placeholder="टेबल नंबर या पता">
        
        <div class="cat-title" onclick="this.nextElementSibling.style.display=(this.nextElementSibling.style.display=='block'?'none':'block')">🍕 PIZZA</div>
        <div style="display:none">
            <div class="item">Veg Pizza - ₹170 <button class="btn" onclick="add('Veg Pizza', 170)">Add</button></div>
            <div class="item">Paneer Pizza - ₹230 <button class="btn" onclick="add('Paneer Pizza', 230)">Add</button></div>
        </div>

        <div class="cat-title" onclick="this.nextElementSibling.style.display=(this.nextElementSibling.style.display=='block'?'none':'block')">🍔 BURGER</div>
        <div style="display:none">
            <div class="item">Veg Burger - ₹50 <button class="btn" onclick="add('Veg Burger', 50)">Add</button></div>
            <div class="item">Cheese Burger - ₹80 <button class="btn" onclick="add('Cheese Burger', 80)">Add</button></div>
        </div>

        <div class="cat-title" onclick="this.nextElementSibling.style.display=(this.nextElementSibling.style.display=='block'?'none':'block')">🥪 SANDWICH</div>
        <div style="display:none">
            <div class="item">Veg Sandwich - ₹100 <button class="btn" onclick="add('Veg Sandwich', 100)">Add</button></div>
            <div class="item">Cheese Sandwich - ₹120 <button class="btn" onclick="add('Cheese Sandwich', 120)">Add</button></div>
        </div>

        <div class="cat-title" onclick="this.nextElementSibling.style.display=(this.nextElementSibling.style.display=='block'?'none':'block')">🍟 FRENCH FRIES</div>
        <div style="display:none">
            <div class="item">French Fries (Full) - ₹80 <button class="btn" onclick="add('French Fries Full', 80)">Add</button></div>
            <div class="item">Masala Fries (Full) - ₹120 <button class="btn" onclick="add('Masala Fries Full', 120)">Add</button></div>
        </div>
        
        <!-- Aap isi tarah baki categories bhi add kar sakte hain -->
    </div>
    <div class="footer">
        <p>Total: ₹<span id="total">0</span></p>
        <button class="btn" style="width:100%;" onclick="sendOrder()">Place Order</button>
    </div>
    <script>
        let total = 0, items = [];
        function add(n, p) { total += p; items.push(n); document.getElementById('total').innerText = total; }
        function sendOrder() {
            let name = document.getElementById('custName').value;
            let addr = document.getElementById('address').value;
            if(!name) { alert("Naam likhein!"); return; }
            let msg = `Order: ${items.join(", ")}%0ATotal: ₹${total}%0AName: ${name}%0ADetails: ${addr}`;
            window.open("https://wa.me/917014808515?text=" + msg);
        }
    </script>
</body>
</html>
